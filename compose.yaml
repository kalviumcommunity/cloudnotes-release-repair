services:
  web:
    image: localhost:5050/cloudnotes:1.0.0
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql://student:practice-only@db:5432/cloudnotes
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 3s
      timeout: 5s
      retries: 10
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: practice-only
      POSTGRES_DB: cloudnotes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d cloudnotes"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata:
